<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tilcayo · Crie seu sonho por aqui</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#150c06;--panel:#201309;--brown:#513019;--sun:#e0883a;--glow:#ffd9a8;--ink:#f7ebdd;--muted:#c9a98c;--line:rgba(224,136,58,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 'Manrope',system-ui,sans-serif}
h1,h2,h3{margin:0 0 .5em;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;text-align:center}
h3{font-size:1.1rem;font-weight:700}
h2 em{font-style:normal;color:var(--sun)}
p{margin:0 0 1em;color:var(--muted)}
.lead{max-width:60ch;margin:0 auto 2rem;text-align:center}
a{color:var(--sun)}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(21,12,6,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:.6rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.brand img{height:30px;display:block}
nav{display:flex;gap:.2rem;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;padding:.35rem .7rem;font-size:.92rem;border-radius:8px}
nav a[aria-current="page"]{color:var(--sun);text-decoration:underline;text-underline-offset:6px}
.btn{display:inline-block;border:1px solid var(--sun);cursor:pointer;background:linear-gradient(135deg,#e0883a,#b8601c);color:#1a0d05;font:700 .95rem 'Manrope',sans-serif;padding:.7rem 1.3rem;border-radius:8px;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:.35rem .8rem;font-size:.85rem}
main{min-height:70vh}
.wrap{max-width:1080px;margin:0 auto;padding:3.5rem 1.2rem}
.hero{position:relative;overflow:hidden;text-align:center;padding:4.5rem 1.2rem 6rem}
.hero::before{content:"";position:absolute;left:50%;top:-90px;width:min(1200px,170%);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#150c06 54%,#b8601c 63%,#e0883a 68%,#ffd9a8 72%,transparent 75%);filter:blur(14px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(transparent,var(--bg))}
.hero>*{position:relative;z-index:2}
.hero .logo{width:min(640px,92%);margin:0 auto 1.8rem;display:block;filter:drop-shadow(0 0 14px #150c06) drop-shadow(0 0 30px #150c06)}@media(min-width:760px){.hero::before{top:-170px}.hero{padding-top:5.5rem}}
.hero p{max-width:58ch;margin:0 auto 1.5rem;color:var(--ink)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.strip{max-width:900px;margin:-2.5rem auto 0;position:relative;z-index:3;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:1.1rem 1.4rem;display:flex;flex-wrap:wrap;gap:.6rem 2rem;justify-content:space-around;align-items:center;font-weight:700;margin-inline:1.2rem}
@media(min-width:960px){.strip{margin-inline:auto}}
.grid{display:grid;gap:1rem}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:linear-gradient(160deg,#2a190c,#1a0f07);border:1px solid var(--line);border-radius:14px;padding:1.4rem}
.card.hl{background:linear-gradient(140deg,#e0883a,#7a3f14);border-color:var(--glow)}
.card.hl p,.card.hl h3{color:#1a0d05}
.ico{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--sun);font-weight:800;margin-bottom:.8rem}
.card.hl .ico{color:#1a0d05;border-color:#1a0d05}
.band{background:linear-gradient(180deg,#3b220f,#513019);border-block:1px solid var(--line)}
.num{border:1px solid rgba(247,235,221,.35);border-radius:14px;padding:1.2rem}
.num b{display:block;font-size:2rem;color:var(--ink);margin-bottom:.4rem}
.num p{color:var(--ink);margin:0}
.chk{padding-left:1.1rem;margin:.6rem 0 0;color:var(--muted)}
.cta{text-align:center;border:1px solid var(--line);border-radius:18px;padding:2.5rem 1.2rem;background:radial-gradient(ellipse at top,#5a3416,#1a0f07 70%)}
.cta p{max-width:52ch;margin-inline:auto}
label{display:block;font-weight:500;margin:.8rem 0 .3rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#150c06;border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem}
textarea{min-height:100px}
.note{font-size:.9rem;color:var(--muted)}
.msg{margin-top:.7rem;font-weight:500}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:.8rem}
footer{border-top:1px solid var(--line);padding:1.5rem 1.2rem;text-align:center;color:var(--muted);font-size:.88rem}
</style>
</head>

 '<div class="card"><div class="ico">I</div><h3>Imobiliárias</h3><p>Uma imobiliária vive de confiança e de boa vitrine. O site apresenta sua empresa com credibilidade e mostra os imóveis de forma organizada para quem está procurando.</p><ul class="chk"><li>Apresentação da imobiliária</li><li>Vitrine de imóveis</li><li>Contato direto com a equipe</li></ul></div></div></section>'+

 document.getElementById('out').onclick=function(){setAdmin(false);route()};
 var cx=document.getElementById('cx');if(cx)cx.onclick=function(){adminView()};
 app.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){adminView(+b.dataset.e);window.scrollTo(0,0)}});
 app.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Remover este projeto?')){var l=load();l.splice(+b.dataset.d,1);save(l);adminView()}}});
 document.getElementById('pf').onsubmit=function(ev){ev.preventDefault();
  var t=document.getElementById('pt').value.trim(),m=document.getElementById('pm');
  if(!t){m.textContent='Informe o nome do projeto.';return}
  var l=load(),old=e!=null?l[e]:null;
  var p={title:t,kind:document.getElementById('pk').value,desc:document.getElementById('pd').value.trim(),link:document.getElementById('pl').value.trim(),img:old?old.img:''};
  function done(){if(e!=null)l[e]=p;else l.push(p);save(l);adminView()}
  var f=document.getElementById('pi').files[0];
  if(f){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),s=Math.min(1,800/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);p.img=c.toDataURL('image/jpeg',.8);done()};im.src=r.result};r.readAsDataURL(f)}else done();
 };
}

function route(){
 var name=location.hash.replace(/^#\/?/,'');
 if(!pages.hasOwnProperty(name))name='';
 if(name==='portfolio'&&isAdmin())adminView();
 else{app.innerHTML=pages[name]();
  var lf=document.getElementById('lf');if(lf)lf.src=LOGO_FULL;
  var f=document.getElementById('lf2');if(f)f.onsubmit=function(ev){ev.preventDefault();if(document.getElementById('c').value===ADMIN_CODE){setAdmin(true);route()}else document.getElementById('lm').textContent='Código incorreto. Tente de novo.'};}
 document.querySelectorAll('#nav a').forEach(function(a){a.removeAttribute('aria-current');if(a.getAttribute('href')==='#/'+name)a.setAttribute('aria-current','page')});
 document.title=(name&&name!=='portfolio'?name.charAt(0).toUpperCase()+name.slice(1)+' · ':'')+'Tilcayo · Crie seu sonho por aqui';
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
